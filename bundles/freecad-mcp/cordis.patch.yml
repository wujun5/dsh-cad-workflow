- insert:
    - id: freecad-mcp
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: freecad
        transport: stdio
        command: __UVX__
        args:
          - freecad-mcp
          - --host
          - __FREECAD_HOST__
          - --freecadcmd
          - __FREECADCMD__
        env:
          UV_PYTHON_PREFERENCE: only-managed
        toolCallTimeoutMs: 180000
